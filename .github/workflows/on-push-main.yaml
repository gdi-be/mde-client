name: Publish Docker image

on:
  push:
    branches: ['main']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: URL to test after deployment
        required: false
        default: https://sensw-geoportal-berlin-mde.intranet.terrestris.de
      e2e_image_tag:
        description: E2E image tag to run
        required: false
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      - name: Generate SBOM for Docker image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Extract SBOM from image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main \
            --format "{{ json .SBOM }}" > sbom.spdx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  push_e2e_to_registry:
    name: Push E2E test Docker image to Container Registry
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for E2E Docker image
        id: meta-e2e
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-e2e
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push E2E test Docker image
        id: push-e2e
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.e2e
          push: true
          tags: ${{ steps.meta-e2e.outputs.tags }}
          labels: ${{ steps.meta-e2e.outputs.labels }}
          sbom: true
          provenance: true

      - name: Generate E2E artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-e2e
          subject-digest: ${{ steps.push-e2e.outputs.digest }}
          push-to-registry: true

  run_e2e_after_deploy:
    name: Run E2E tests after deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.playwright_base_url }}
      E2E_IMAGE: ghcr.io/${{ github.repository }}-e2e:${{ github.event.inputs.e2e_image_tag }}
    steps:
      - name: Wait for url to be reachable
        run: |
          for i in {1..30}; do
            if curl --silent --show-error --fail --location "$PLAYWRIGHT_BASE_URL" > /dev/null; then
              echo "Deployment is reachable"
              exit 0
            fi
            echo "Waiting for deployment... attempt $i/30"
            sleep 10
          done
          echo "Deployment did not become reachable in time"
          exit 1

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull E2E test image
        run: docker pull "$E2E_IMAGE"

      - name: Run E2E tests in container
        id: e2e-run
        run: |
          set +e
          docker run --name e2e-tests \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            "$E2E_IMAGE"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Copy Playwright report from container
        if: always()
        run: |
          mkdir -p test-results
          docker cp e2e-tests:/app/test-results ./test-results || true
          docker rm e2e-tests || true

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          if-no-files-found: warn

      - name: Fail workflow when E2E tests fail
        if: steps.e2e-run.outputs.exit_code != '0'
        run: |
          echo "E2E tests failed with exit code ${{ steps.e2e-run.outputs.exit_code }}"
          exit 1
